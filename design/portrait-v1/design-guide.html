<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星河音乐 · 功能说明</title><link rel="stylesheet" href="styles.css"></head><body><main class="design-guide"><a href="index.html">← 返回界面</a><h1>星河音乐</h1><p>让好音乐，随心而听。</p><h2>播放</h2><p>在歌单中播放全部会切换当前队列。选择单曲会将歌曲放在队首播放，其他歌曲保留。四种播放模式通过点击图标切换。</p><h2>歌词与队列</h2><p>滑动歌词只浏览，点击歌词才调整进度；停止浏览 2 秒后回到当前歌词。队列拖动手柄位于删除按钮旁，换序只影响当前播放。</p><h2>音乐与文件</h2><p>收藏记录保存在应用内。移除本地音乐引用保留原文件，删除下载文件需要确认。已授权音乐目录与 U 盘支持自动扫描。</p><h2>主题与账号</h2><p>可选日间、夜间、跟随系统主题。自动播放默认关闭。平台账号提供各平台支持的关联方式。</p><h2>功能来源</h2><p><a href="https://github.com/guohuiyuan/go-music-dl" target="_blank" rel="noopener">GoMusicDll</a> · <a href="https://github.com/liangle902/CarMusic" target="_blank" rel="noopener">星河音乐</a></p></main></body></html>
